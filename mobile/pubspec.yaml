name: safer_ci
description: SafeR — smart home & security app (Tuya-style) for the SafeR CI platform. Multi-brand device onboarding (Tuya, Hikvision, Dahua, Ajax, Matter, ONVIF, Home Assistant).
version: 0.2.0+2
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0

  # Network
  dio: ^5.7.0
  web_socket_channel: ^3.0.1

  # Local storage
  shared_preferences: ^2.3.3

  # Device onboarding (QR codes for Matter / Tuya)
  mobile_scanner: ^6.0.2

  # Camera streams (RTSP / HLS / MJPEG)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  # Location (SOS, home position)
  geolocator: ^13.0.2

  # Utils
  intl: ^0.20.3
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

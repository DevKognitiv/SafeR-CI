# Alembic configuration for the SafeR Hub schema (backend/app/hub/models.py).
#
# Usage (from backend/):
#   python -m alembic -c alembic.ini upgrade head
#   python -m alembic -c alembic.ini -x url=sqlite:////tmp/check.db upgrade head
#
# The database URL is resolved by alembic/env.py, never stored here:
#   -x url=<url>  >  HUB_DATABASE_URL  >  DATABASE_URL  >  sqlite:///./safer_hub.db
# Async URLs (sqlite+aiosqlite, postgresql+asyncpg) are converted to their sync drivers.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
file_template = %%(rev)s
timezone = UTC
truncate_slug_length = 40
version_path_separator = os
# The hub keeps its own version table (the main API may share the database)
version_table = hub_alembic_version

[post_write_hooks]

# Logging: the migration engine never echoes SQL or URLs with credentials.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

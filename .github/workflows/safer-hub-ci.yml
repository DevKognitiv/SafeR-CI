name: SafeR Hub & Mobile CI

on:
  push:
    paths:
      - "backend/**"
      - "mobile/**"
      - "tool/ci/**"
      - ".github/workflows/safer-hub-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "mobile/**"
      - "tool/ci/**"
      - ".github/workflows/safer-hub-ci.yml"

jobs:
  hub-backend:
    name: Hub backend (pytest + pylint + migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio aiosqlite pylint
      - name: Import check
        run: python -c "import app.hub.app"
        env:
          SECRET_KEY: ci-secret
      - name: Run hub tests
        run: pytest app/hub/tests -q
        env:
          SECRET_KEY: ci-secret
      - name: Pylint (hub package)
        run: pylint --rcfile=.pylintrc app/hub --fail-under=9.0
      - name: Alembic upgrade, downgrade and re-upgrade on a fresh SQLite database
        run: |
          rm -f /tmp/safer_hub_ci.db
          python -m alembic -c alembic.ini -x url=sqlite:////tmp/safer_hub_ci.db upgrade head
          python -m alembic -c alembic.ini -x url=sqlite:////tmp/safer_hub_ci.db current
          python -m alembic -c alembic.ini -x url=sqlite:////tmp/safer_hub_ci.db downgrade -1
          python -m alembic -c alembic.ini -x url=sqlite:////tmp/safer_hub_ci.db upgrade head
        env:
          SECRET_KEY: ci-secret

  mobile:
    name: SafeR app (analyze + test + web build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test (unit, widget and accessibility guidelines)
        run: flutter test --exclude-tags golden
      - name: Golden tests (pixel truth, 0.1 % tolerance)
        run: flutter test --tags golden test/goldens
      - name: Upload golden failure diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: mobile/test/**/failures/**
          if-no-files-found: ignore
      - name: Build web
        run: flutter build web --release --dart-define=SAFER_HUB_URL=https://api.safer-ci.app

  mobile-screenshots:
    name: SafeR app (demo web build + Playwright screenshot captures)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencies
        run: flutter pub get
      - name: Build web in demo mode (self-hosted CanvasKit)
        run: flutter build web --release --dart-define=SAFER_DEMO=1 --no-web-resources-cdn
      - name: Install Playwright 1.56.1 and Chromium
        working-directory: mobile/tool/screenshots
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx --no-install playwright install --with-deps chromium
      - name: Capture the screen matrix (fails on a missing variant or an app error)
        run: node tool/screenshots/capture.mjs --web-dir=build/web --out=tool/screenshots/out
      - name: Verify the manifest covers the whole matrix
        run: node tool/screenshots/capture.mjs --check --out=tool/screenshots/out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-screenshots
          path: mobile/tool/screenshots/out
          retention-days: 14
          if-no-files-found: error

  mobile-android:
    name: SafeR app (Android bundle size + 16 KB alignment)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Build release bundle (debug signing)
        run: flutter build appbundle --release --dart-define=SAFER_HUB_URL=https://api.safer-ci.app
      - name: Bundle size, asset budgets and 16 KB ELF alignment
        run: >
          python3 ../tool/ci/aab_check.py build/app/outputs/bundle/release/app-release.aab
          --budget ../tool/ci/size_budget.json --report ../aab-report.md
      - name: Publish the bundle report to the job summary
        if: always()
        run: cat ../aab-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aab-report
          path: aab-report.md
          retention-days: 30
          if-no-files-found: ignore

  mobile-testlab:
    name: SafeR app (Firebase Test Lab robo smoke, needs credentials)
    runs-on: ubuntu-latest
    needs: mobile
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Check Test Lab credentials
        id: gate
        env:
          SA_KEY: ${{ secrets.FIREBASE_TEST_LAB_SA }}
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          BUCKET: ${{ secrets.FIREBASE_RESULTS_BUCKET }}
        run: |
          if [ -z "$SA_KEY" ] || [ -z "$PROJECT" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Firebase Test Lab skipped::FIREBASE_TEST_LAB_SA / FIREBASE_PROJECT_ID secrets are not configured (see docs/qa/device-capture.md §4)"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$BUCKET" ]; then echo "bucket=true" >> "$GITHUB_OUTPUT"; else echo "bucket=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        if: steps.gate.outputs.enabled == 'true'
        with:
          channel: stable
          flutter-version: "3.47.2"
          cache: true
      - name: Build debug APK in demo mode
        if: steps.gate.outputs.enabled == 'true'
        run: flutter pub get && flutter build apk --debug --dart-define=SAFER_DEMO=1
      - uses: google-github-actions/auth@v2
        if: steps.gate.outputs.enabled == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_TEST_LAB_SA }}
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.gate.outputs.enabled == 'true'
      - name: Robo smoke run (Android 10 and 14 images, French locale)
        if: steps.gate.outputs.enabled == 'true'
        env:
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          BUCKET: ${{ secrets.FIREBASE_RESULTS_BUCKET }}
        run: |
          gcloud config set project "$PROJECT"
          EXTRA=()
          if [ -n "$BUCKET" ]; then EXTRA+=(--results-bucket "$BUCKET"); fi
          gcloud firebase test android run --type robo \
            --app build/app/outputs/flutter-apk/app-debug.apk \
            --device model=MediumPhone.arm,version=29,locale=fr,orientation=portrait \
            --device model=MediumPhone.arm,version=34,locale=fr,orientation=portrait \
            --timeout 5m --results-dir "safer-${{ github.sha }}" --results-history-name safer-smoke \
            "${EXTRA[@]}"
      - name: Download Test Lab artifacts
        if: steps.gate.outputs.enabled == 'true' && steps.gate.outputs.bucket == 'true'
        env:
          BUCKET: ${{ secrets.FIREBASE_RESULTS_BUCKET }}
        run: gcloud storage cp -r "${BUCKET%/}/safer-${{ github.sha }}" ../testlab-artifacts || true
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.enabled == 'true' && steps.gate.outputs.bucket == 'true'
        with:
          name: testlab-artifacts
          path: testlab-artifacts
          retention-days: 14
          if-no-files-found: ignore
